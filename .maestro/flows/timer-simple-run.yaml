appId: com.project200.undabang
name: 심플 타이머 실행과 일시정지·재개·자연 종료
tags:
  - regression
  - requires-login
---
# 심플 타이머는 종료 버튼이 없습니다(#611 완료 기준). 재생/정지 아이콘 상태와 남은 시간만으로
# 시작·일시정지·재개·자연 종료를 확인합니다. 정확한 초 값은 단정하지 않고 두 시점을 비교합니다.
# 실행 중에는 SimpleTimerService가 포그라운드로 뜨므로, 플로우 끝에 반드시 종료까지 확인합니다
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml

- tapOn: "심플 타이머"
- extendedWaitUntil:
    visible:
      id: simple_timer_add_cell
    timeout: 30000

# 자연 종료까지 기다려야 해서 아주 짧은 시간으로 프리셋을 만듭니다
- evalScript: ${output.runSec = (Date.now() % 10) + 5}
- evalScript: ${output.runLabel = '00:' + ('0' + output.runSec).slice(-2)}

- tapOn:
    id: simple_timer_add_cell
- extendedWaitUntil:
    visible:
      id: second_et
    timeout: 10000
- tapOn:
    id: second_et
- eraseText
- inputText: ${output.runSec}
- tapOn:
    id: confirm_btn
- assertVisible: ${output.runLabel}

# 프리셋 탭 -> setAndStartTimer로 바로 시작합니다 (TimerListViewModel이 아니라 SimpleTimerViewModel 경로)
- tapOn: ${output.runLabel}
- extendedWaitUntil:
    visible:
      id: simple_timer_pause_icon
    timeout: 10000

# 진행 확인: 두 시점의 남은 시간이 감소하는지 봅니다. 정확한 초는 비교하지 않습니다
- copyTextFrom:
    id: simple_timer_remaining_time
- evalScript: ${output.running1 = maestro.copiedText}
- extendedWaitUntil:
    visible:
      id: __e2e611_sleep_anchor__
    timeout: 1500
    optional: true
- copyTextFrom:
    id: simple_timer_remaining_time
- evalScript: ${output.progressed = (parseInt(maestro.copiedText.split(':')[0], 10) * 60 + parseInt(maestro.copiedText.split(':')[1], 10)) < (parseInt(output.running1.split(':')[0], 10) * 60 + parseInt(output.running1.split(':')[1], 10))}
- assertTrue:
    condition: ${output.progressed}
    label: 실행 중 남은 시간이 줄어드는지 확인

# 일시정지: 아이콘이 재생으로 바뀌고 남은 시간이 멈춰야 한다
- tapOn:
    id: simple_timer_pause_icon
- extendedWaitUntil:
    visible:
      id: simple_timer_play_icon
    timeout: 10000
- copyTextFrom:
    id: simple_timer_remaining_time
- evalScript: ${output.paused1 = maestro.copiedText}
- extendedWaitUntil:
    visible:
      id: __e2e611_sleep_anchor__
    timeout: 1200
    optional: true
- copyTextFrom:
    id: simple_timer_remaining_time
- assertTrue:
    condition: ${output.paused1 == maestro.copiedText}
    label: 일시정지 중 남은 시간이 유지되는지 확인

# 재개: 아이콘이 다시 정지(진행 중)로 바뀌고 남은 시간이 다시 줄어든다
- tapOn:
    id: simple_timer_play_icon
- extendedWaitUntil:
    visible:
      id: simple_timer_pause_icon
    timeout: 10000
- copyTextFrom:
    id: simple_timer_remaining_time
- evalScript: ${output.resumed1 = maestro.copiedText}
- extendedWaitUntil:
    visible:
      id: __e2e611_sleep_anchor__
    timeout: 1500
    optional: true
- copyTextFrom:
    id: simple_timer_remaining_time
- evalScript: ${output.resumedProgress = (parseInt(maestro.copiedText.split(':')[0], 10) * 60 + parseInt(maestro.copiedText.split(':')[1], 10)) < (parseInt(output.resumed1.split(':')[0], 10) * 60 + parseInt(output.resumed1.split(':')[1], 10))}
- assertTrue:
    condition: ${output.resumedProgress}
    label: 재개 후 남은 시간이 다시 줄어드는지 확인

# 자연 종료: 재생 아이콘이 다시 나타날 때까지 기다립니다. 타이머가 멈추면 아이콘이 되돌아간다는
# 상태 전환으로 완료를 판정하고, 남은 시간은 00:00(고정값)으로 확인합니다
- extendedWaitUntil:
    visible:
      id: simple_timer_play_icon
    timeout: ${(output.runSec + 15) * 1000}
- copyTextFrom:
    id: simple_timer_remaining_time
- assertTrue:
    condition: ${maestro.copiedText == '00:00'}
    label: 자연 종료 후 남은 시간이 00:00으로 고정되는지 확인

# 정리: 생성한 프리셋을 삭제합니다
- tapOn:
    id: "simple_timer_menu_${output.runSec}"
- tapOn: "삭제"
- assertNotVisible: ${output.runLabel}
