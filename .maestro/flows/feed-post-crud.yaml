appId: com.project200.undabang
name: 피드 글 작성·수정·삭제
tags:
  - regression
  - requires-login
---
# 실행마다 고유한 ASCII 본문으로 글을 쓰고 목록·상세에서 같은 내용이 보이는지 확인합니다
# 수정은 longPress + "전체 선택"으로 기존 본문을 지우고 새 고유 본문으로 완전히 바꿉니다
# (Maestro 공식 레시피 "Clearing large text blocks"와 같은 방식입니다. "전체 선택"은 안드로이드
# 시스템 텍스트 선택 툴바의 고정 번역이라 화면마다 따로 확인할 필요가 없습니다)
# 삭제까지 같은 플로우에서 마쳐 이번 실행이 만든 글이 남지 않게 합니다
- runFlow: ../subflows/launch-logged-in.yaml

- evalScript: ${output.createTag = FEED_POST}
- evalScript: ${output.editTag = FEED_EDITED_POST}

- tapOn:
    id: feed_nav_graph
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 30000

# 작성
- tapOn:
    id: feed_add_button
- extendedWaitUntil:
    visible:
      id: feed_form_content_field
    timeout: 30000
- tapOn:
    id: feed_form_content_field
- runFlow: ../subflows/feed-ascii-keyboard.yaml
- inputText: ${output.createTag}
# 잘못 입력된 본문을 저장 전에 잡아 목록 갱신 실패와 구분합니다.
- assertVisible:
    id: feed_form_content_field
    text: ${output.createTag}
- tapOn:
    id: feed_form_complete_button

# 새 글은 보존된 키 항목보다 앞에 오므로 위로 찾습니다.
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 30000
- scrollUntilVisible:
    element: ${output.createTag}
    direction: UP
    timeout: 20000
- assertVisible: ${output.createTag}

# 상세에서 같은 본문 확인
- tapOn: ${output.createTag}
- extendedWaitUntil:
    visible: ${output.createTag}
    timeout: 20000
- assertVisible: ${output.createTag}

# 본문 수정 (더보기 > 수정하기)
- tapOn:
    id: feed_detail_more_button
- tapOn: "수정하기"
- extendedWaitUntil:
    visible:
      id: feed_form_content_field
      text: ${output.createTag}
    timeout: 20000
- longPressOn:
    id: feed_form_content_field
- tapOn: "전체 선택"
- runFlow: ../subflows/feed-ascii-keyboard.yaml
- inputText: ${output.editTag}
- tapOn:
    id: feed_form_complete_button

# 수정 완료는 상세 화면으로 되돌아갑니다. 상세 재조회에서 바뀐 본문을 확인합니다
- extendedWaitUntil:
    visible: ${output.editTag}
    timeout: 20000
- assertVisible: ${output.editTag}
- assertNotVisible: ${output.createTag}

# 목록으로 돌아가 재조회에서도 바뀐 본문을 확인합니다
- tapOn: "뒤로가기"
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 20000
- scrollUntilVisible:
    element: ${output.editTag}
    direction: DOWN
    timeout: 20000
- assertVisible: ${output.editTag}

# 삭제 (정리를 겸합니다). 삭제는 목록으로 돌아가며 갱신 신호를 보냅니다
- tapOn: ${output.editTag}
- extendedWaitUntil:
    visible: ${output.editTag}
    timeout: 20000
- tapOn:
    id: feed_detail_more_button
- tapOn: "삭제하기"
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 20000
- assertNotVisible: ${output.editTag}
