appId: com.project200.undabang
name: 피드 좋아요 토글과 재진입 확인
tags:
  - regression
  - requires-login
---
# 낙관적 변화 뒤 실제 좋아요 요청이 끝난 상태를 기다립니다. 고정 시간 대기는 사용하지 않습니다.
# 상세를 다시 열어 서버에 저장된 좋아요/취소 상태를 각각 확인합니다.
# 이번 실행이 만든 새 글에서만 토글하므로 초기값(좋아요 0, 미좋아요)을 그대로 가정할 수 있습니다.
- runFlow: ../subflows/launch-logged-in.yaml

- evalScript: ${output.tag = FEED_POST}

- tapOn:
    id: feed_nav_graph
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 30000

- tapOn:
    id: feed_add_button
- extendedWaitUntil:
    visible:
      id: feed_form_content_field
    timeout: 30000
- tapOn:
    id: feed_form_content_field
- inputText: ${output.tag}
# 잘못 입력된 본문을 저장 전에 잡아 목록 갱신 실패와 구분합니다.
- assertVisible:
    id: feed_form_content_field
    text: ${output.tag}
- tapOn:
    id: feed_form_complete_button

- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 30000
- scrollUntilVisible:
    element: ${output.tag}
    direction: DOWN
    timeout: 20000
- tapOn: ${output.tag}
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000

# 초기 상태: 새 글이라 좋아요 0, 미좋아요
- assertVisible:
    id: feed_detail_likes_count
    text: "0"
- assertVisible: "좋아요"

# 좋아요 — 탭 직후 낙관적 변화
- tapOn: "좋아요"
- assertVisible:
    id: feed_detail_likes_count
    text: "1"
- assertVisible: "좋아요 취소"

# 디바운스와 실제 네트워크 요청이 모두 끝난 상태에서만 화면을 벗어납니다.
- extendedWaitUntil:
    visible:
      id: feed_detail_like_settled
    timeout: 30000

# 상세를 나갔다 다시 들어와 저장된 값인지 확인 (즉시 화면 변화만으로 통과시키지 않습니다)
- tapOn: "뒤로가기"
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 20000
- scrollUntilVisible:
    element: ${output.tag}
    direction: DOWN
    timeout: 20000
- tapOn: ${output.tag}
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible:
    id: feed_detail_likes_count
    text: "1"
- assertVisible: "좋아요 취소"

# 좋아요 취소 — 탭 직후 낙관적 변화
- tapOn: "좋아요 취소"
- assertVisible:
    id: feed_detail_likes_count
    text: "0"
- assertVisible: "좋아요"

- extendedWaitUntil:
    visible:
      id: feed_detail_like_settled
    timeout: 30000

# 다시 나갔다 들어와 취소도 저장되었는지 확인
- tapOn: "뒤로가기"
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 20000
- scrollUntilVisible:
    element: ${output.tag}
    direction: DOWN
    timeout: 20000
- tapOn: ${output.tag}
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible:
    id: feed_detail_likes_count
    text: "0"
- assertVisible: "좋아요"

# 정리: 이번 실행이 만든 글을 지웁니다
- tapOn:
    id: feed_detail_more_button
- tapOn: "삭제하기"
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 20000
- assertNotVisible: ${output.tag}
