appId: com.project200.undabang
name: 심플 타이머 프리셋 생성 단계
tags:
  - regression
  - requires-login
---
# 생성 직후에는 호스트 fixture가 Room 차이로 localId를 확정합니다.
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml
- tapOn: "심플 타이머"
- scrollUntilVisible:
    element:
      id: simple_timer_add_cell
    direction: DOWN
    timeout: 30000
- tapOn:
    id: simple_timer_add_cell
- runFlow:
    file: ../subflows/timer-set-time.yaml
    env:
      TIMER_MINUTES: "0"
      TIMER_SECONDS: "41"
- extendedWaitUntil:
    visible: "심플 타이머"
    timeout: 10000
