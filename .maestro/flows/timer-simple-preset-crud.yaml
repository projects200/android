appId: com.project200.undabang
name: 심플 타이머 프리셋 생성 전 목록 단계
tags:
  - regression
  - requires-login
---
# 목록의 서버 행이 Room에 반영된 뒤 fixture가 생성 전 localId를 기록합니다.
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml
- tapOn: "심플 타이머"
- scrollUntilVisible:
    element:
      id: simple_timer_add_cell
    direction: DOWN
    timeout: 30000
