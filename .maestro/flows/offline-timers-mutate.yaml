appId: com.project200.undabang
name: 실제 오프라인 커스텀 타이머 수정 삭제 생성
---
- runFlow: ../offline/open-timer-list.yaml
- scrollUntilVisible:
    element:
      id: custom_timer_add_card
    direction: DOWN
    timeout: 30000
- runFlow:
    file: ../offline/edit-timer.yaml
    env:
      EDIT_TIMER_TITLE: "${TIMER_ORIGINAL_TITLE}"
      EXPECTED_TIMER_TIME: "00:45"
- runFlow:
    file: ../subflows/timer-clear-text.yaml
    env:
      FIELD_ID: custom_timer_form_title_field
- runFlow: ../subflows/timer-ascii-keyboard.yaml
- inputText: "${TIMER_UPDATED_TITLE}"
- assertVisible:
    id: custom_timer_form_title_field
    text: "${TIMER_UPDATED_TITLE}"
- hideKeyboard
- runFlow:
    file: ../offline/set-timer-time.yaml
    env:
      TIMER_TIME_FIELD: custom_timer_form_step_time_0
      TIMER_MINUTES: "01"
      TIMER_SECONDS: "15"
- tapOn:
    id: custom_timer_form_submit_btn
- extendedWaitUntil:
    visible:
      text: "${TIMER_UPDATED_TITLE}"
    timeout: 30000
- assertVisible:
    id: custom_timer_step_time_0
    text: "01:15"
- back
- scrollUntilVisible:
    element:
      text: "${TIMER_DELETE_TITLE}"
    direction: DOWN
    timeout: 30000
- tapOn: "${TIMER_DELETE_TITLE}"
- tapOn:
    id: custom_timer_menu_btn
- tapOn: 삭제하기
- assertVisible: "정말 타이머를 삭제할까요[?]"
- tapOn: 확인
- extendedWaitUntil:
    visible:
      id: custom_timer_add_card
    timeout: 30000
- runFlow:
    file: ../offline/create-timer.yaml
    env:
      NEW_TIMER_TITLE: "${TIMER_CREATE_TITLE}"
- runFlow: ../offline/assert-timer-list.yaml
