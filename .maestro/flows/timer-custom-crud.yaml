appId: com.project200.undabang
name: 커스텀 타이머 생성·수정·순서 변경·삭제
tags:
  - regression
  - requires-login
---
# 이름 구분 가능한 두 단계로 커스텀 타이머를 만들고, 이름·스텝 시간·순서를 수정한 뒤
# 상세 재진입에서 저장값을 확인하고 마지막에 삭제합니다 (#611 작업 상세 3~6번).
# 스텝 시간은 도메인 최소값(5초, ValidateCustomTimerUseCase)을 그대로 씁니다
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml

- evalScript: ${output.tag = 'e2e611c' + Date.now()}

- tapOn:
    id: custom_timer_add_card
- extendedWaitUntil:
    visible:
      id: custom_timer_form_title_field
    timeout: 20000

# 제목
- tapOn:
    id: custom_timer_form_title_field
- inputText: ${output.tag}

# 스텝1: StepA, 5초
- tapOn:
    id: custom_timer_form_new_step_name_field
- inputText: "StepA"
- tapOn:
    id: custom_timer_form_new_step_time
- extendedWaitUntil:
    visible:
      id: second_et
    timeout: 10000
- tapOn:
    id: second_et
- eraseText
- inputText: "5"
- tapOn:
    id: confirm_btn
- tapOn:
    id: custom_timer_form_add_step_btn

# 스텝2: StepB, 5초 (footer가 비워진 채 재사용됨)
- tapOn:
    id: custom_timer_form_new_step_name_field
- inputText: "StepB"
- tapOn:
    id: custom_timer_form_new_step_time
- extendedWaitUntil:
    visible:
      id: second_et
    timeout: 10000
- tapOn:
    id: second_et
- eraseText
- inputText: "5"
- tapOn:
    id: confirm_btn
- tapOn:
    id: custom_timer_form_add_step_btn

- assertVisible: "StepA"
- assertVisible: "StepB"
- tapOn: "완료"

# 생성 성공 시 상세 화면으로 이동합니다 (popUpTo로 폼이 스택에서 빠짐)
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible:
    id: custom_timer_step_name_0
- assertVisible:
    id: custom_timer_step_name_1

# 재진입 확인: 목록으로 나갔다가 이름(ASCII 태그)으로 다시 들어옵니다
- back
- extendedWaitUntil:
    visible:
      id: custom_timer_add_card
    timeout: 30000
- tapOn: ${output.tag}
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible: "StepA"
- assertVisible: "StepB"

# 수정: 이름 변경 + StepA 이름 변경 + StepB 시간 변경 + 순서 변경
- tapOn:
    id: custom_timer_menu_btn
- tapOn: "수정하기"
- extendedWaitUntil:
    visible:
      id: custom_timer_form_title_field
    timeout: 20000

- tapOn:
    id: custom_timer_form_title_field
- eraseText
- inputText: "${output.tag}-ed"

- tapOn:
    id: custom_timer_form_step_name_0
- eraseText
- inputText: "StepA2"

- tapOn:
    id: custom_timer_form_step_time_1
- extendedWaitUntil:
    visible:
      id: second_et
    timeout: 10000
- tapOn:
    id: second_et
- eraseText
- inputText: "6"
- tapOn:
    id: confirm_btn

# 순서 변경: 첫 스텝(order 0) 핸들을 아래로 스와이프합니다. order 필드는 유지된 채 위치만 바뀌어
# 제출 시 getStepsWithFinalOrder()가 위치 기준으로 order를 다시 매깁니다.
# 실제 기기에서 reorderable 라이브러리가 swipe 제스처로 드래그가 걸리는지는 미실행 상태라 확인하지 못했습니다
- swipe:
    from:
      id: custom_timer_form_step_handle_0
    direction: DOWN
    duration: 1000

- tapOn: "완료"
- extendedWaitUntil:
    visible: "${output.tag}-ed"
    timeout: 20000

# 순서가 실제로 바뀌었다면 order=0 자리에는 이제 StepB가, order=1 자리에는 StepA2가 와야 합니다
- copyTextFrom:
    id: custom_timer_step_name_0
- evalScript: ${output.firstStepName = maestro.copiedText}
- assertTrue:
    condition: ${output.firstStepName == 'StepB'}
    label: 드래그 순서 변경으로 첫 스텝이 StepB로 바뀌었는지 확인
- assertVisible:
    id: custom_timer_step_name_1
- assertVisible: "StepA2"
- assertVisible: "00:06"

# 삭제 후 목록에서 제거되는지
- tapOn:
    id: custom_timer_menu_btn
- tapOn: "삭제하기"
- tapOn: "확인"
- extendedWaitUntil:
    visible:
      id: custom_timer_add_card
    timeout: 20000
- assertNotVisible: "${output.tag}-ed"
