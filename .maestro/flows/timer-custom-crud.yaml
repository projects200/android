appId: com.project200.undabang
name: 커스텀 타이머 생성·수정·순서 변경·삭제
tags:
  - regression
  - requires-login
---
# 이름 구분 가능한 두 단계로 커스텀 타이머를 만들고, 이름·스텝 시간·순서를 수정한 뒤
# 상세 재진입에서 저장값을 확인하고 마지막에 삭제합니다 (#611 작업 상세 3~6번).
# 스텝 시간은 도메인 최소값(5초, ValidateCustomTimerUseCase)을 그대로 씁니다

- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml
- evalScript: ${output.tag = TIMER_CUSTOM_TITLE}
# 관찰한 실제 localId로 재진입하고 제목과 스텝 값은 별도로 확인합니다
- extendedWaitUntil:
    visible: "심플 타이머"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "custom_timer_${TIMER_CUSTOM_LOCAL_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "custom_timer_${TIMER_CUSTOM_LOCAL_ID}"
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible:
    id: custom_timer_step_name_0
    text: "StepA"
- assertVisible:
    id: custom_timer_step_name_1
    text: "StepB"

# 수정: 이름 변경 + StepA 이름 변경 + StepB 시간 변경 + 순서 변경
- tapOn:
    id: custom_timer_menu_btn
- tapOn: "수정하기"
- extendedWaitUntil:
    visible:
      id: custom_timer_form_title_field
    timeout: 20000

- runFlow:
    file: ../subflows/timer-clear-text.yaml
    env:
      FIELD_ID: custom_timer_form_title_field
- runFlow: ../subflows/timer-ascii-keyboard.yaml
- inputText: "${output.tag}-ed"
- assertVisible:
    id: custom_timer_form_title_field
    text: "${output.tag}-ed"

- runFlow:
    file: ../subflows/timer-clear-text.yaml
    env:
      FIELD_ID: custom_timer_form_step_name_0
- runFlow: ../subflows/timer-ascii-keyboard.yaml
- inputText: "StepA2"
- assertVisible:
    id: custom_timer_form_step_name_0
    text: "StepA2"

- tapOn:
    id: custom_timer_form_step_time_1
- runFlow:
    file: ../subflows/timer-set-time.yaml
    env:
      TIMER_MINUTES: "0"
      TIMER_SECONDS: "6"

# 순서 변경: 첫 스텝(order 0) 핸들을 아래로 스와이프합니다. order 필드는 유지된 채 위치만 바뀌어
# 제출 시 getStepsWithFinalOrder()가 위치 기준으로 order를 다시 매깁니다.
# 키보드를 내려 핸들과 다음 스텝 사이의 실제 드래그 경로를 확보합니다.
- runFlow: ../subflows/timer-hide-keyboard.yaml
- swipe:
    from:
      id: custom_timer_form_step_handle_0
    direction: DOWN
    duration: 1000

- tapOn:
    id: custom_timer_form_submit_btn
- extendedWaitUntil:
    notVisible:
      id: custom_timer_form_title_field
    timeout: 20000
- extendedWaitUntil:
    visible: "${output.tag}-ed"
    timeout: 20000

# 제출 직후와 목록 재진입 뒤에 위치별 이름·시간을 모두 확인합니다.
- assertVisible:
    id: custom_timer_step_name_0
    text: "StepB"
- assertVisible:
    id: custom_timer_step_time_0
    text: "00:06"
- assertVisible:
    id: custom_timer_step_name_1
    text: "StepA2"
- assertVisible:
    id: custom_timer_step_time_1
    text: "00:05"
- back
- extendedWaitUntil:
    visible: "심플 타이머"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "custom_timer_${TIMER_CUSTOM_LOCAL_ID}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "custom_timer_${TIMER_CUSTOM_LOCAL_ID}"
- extendedWaitUntil:
    visible: "${output.tag}-ed"
    timeout: 20000
- assertVisible:
    id: custom_timer_step_name_0
    text: "StepB"
- assertVisible:
    id: custom_timer_step_time_0
    text: "00:06"
- assertVisible:
    id: custom_timer_step_name_1
    text: "StepA2"
- assertVisible:
    id: custom_timer_step_time_1
    text: "00:05"

# 삭제 후 목록에서 제거되는지
- tapOn:
    id: custom_timer_menu_btn
- tapOn: "삭제하기"
- tapOn: "확인"
- extendedWaitUntil:
    visible: "심플 타이머"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: custom_timer_add_card
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: "custom_timer_${TIMER_CUSTOM_LOCAL_ID}"
