appId: com.project200.undabang
name: 운동 장소 등록·수정·삭제
tags:
  - regression
  - requires-login
---
# 목록 → 추가 → 등록 → 목록 확인(재진입) → 이름 수정 → 재조회 확인 → 삭제 → 재진입 확인까지 한 번에 봅니다
# 소스에 별도 장소 상세 화면이 없어(이슈 본문 확인) 목록 메뉴와 검색·편집 화면만 사용합니다
#
# 키워드 검색 관련 참고:
# Maestro inputText는 안드로이드 제약으로 한글을 입력할 수 없고, ExercisePlaceSearchViewModel의 검색은
# GetPlacesByKeywordUseCase를 통해 실제 카카오 로컬 키워드 검색 API를 호출합니다(단위 테스트 샘플 쿼리도 "헬스장").
# 한국 업체명 기반 API라 ASCII 쿼리로 안정적인 결과를 보장할 수 없어 타이핑 검색 단계는 넣지 않습니다.
# 대신 검색 화면 진입 시 위치 권한이 허용돼 있으면 현재 위치가 자동으로 역지오코딩되어 place_name_tv에 채워지는
# 경로를 "결과 선택"의 대체 경로로 사용합니다. 이 경로도 실제 ExercisePlaceSearchFragment 코드 경로입니다
- runFlow: ../subflows/launch-logged-in.yaml

- tapOn:
    id: matching_nav_graph
- runFlow: ../subflows/matching-dismiss-guides.yaml
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 30000

# 이번 실행을 구분할 고유 장소명 (ASCII만 허용)
- evalScript: ${output.tag = 'e2e613-' + Date.now()}

- tapOn: "운동 장소 목록"
- extendedWaitUntil:
    visible: "운동 장소"
    timeout: 20000

- tapOn: "추가"
# ExercisePlaceSearchFragment: 위치 권한이 있으면 현재 위치로 지도 이동 후 자동으로 주소를 역지오코딩합니다
- extendedWaitUntil:
    visible:
      id: "place_name_tv"
      text: ".+"
    timeout: 30000
- tapOn:
    id: "register_exercise_place_btn"

- extendedWaitUntil:
    visible: "장소명 (필수)"
    timeout: 20000
- tapOn:
    id: "place_name_input"
# 초기값이 비어 있지 않을 수 있어(역지오코딩된 주소가 장소명으로 들어올 수 있음) 지우고 고유 태그만 남깁니다
- eraseText: 80
- inputText: ${output.tag}
- tapOn: "주소 등록"

# 등록 완료 액션은 popUpTo(matchingMapFragment)로 목록 화면을 새로 띄워 서버에서 다시 조회합니다
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible: ${output.tag}
- assertVisible:
    id: "place_address_${output.tag}"

# 재진입 확인: 목록에서 빠져나갔다가 다시 들어와도 서버에 저장된 값이 유지되는지 봅니다
- back
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000
- tapOn: "운동 장소 목록"
- extendedWaitUntil:
    visible: ${output.tag}
    timeout: 20000
- assertVisible: ${output.tag}

# 이름 수정: 메뉴 → 수정 → 이름 교체 → 등록(수정 액션도 같은 버튼을 씁니다)
- tapOn:
    id: "place_menu_btn_${output.tag}"
- tapOn: "수정"
- extendedWaitUntil:
    visible: "장소명 (필수)"
    timeout: 20000
- evalScript: ${output.editedTag = output.tag + '-edit'}
- tapOn:
    id: "place_name_input"
- eraseText: 80
- inputText: ${output.editedTag}
- tapOn: "주소 등록"

# 재조회 결과 확인: 수정 완료도 같은 popUpTo 액션이라 목록이 서버에서 다시 조회됩니다
- extendedWaitUntil:
    visible: ${output.editedTag}
    timeout: 20000
- assertVisible: ${output.editedTag}

# 삭제: 로컬 상태만 갱신되는 동작이라, 삭제 뒤 목록을 나갔다 재진입해 서버 상태를 다시 조회하게 합니다
- tapOn:
    id: "place_menu_btn_${output.editedTag}"
- tapOn: "삭제"
- back
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000
- tapOn: "운동 장소 목록"
- extendedWaitUntil:
    visible: "운동 장소"
    timeout: 20000
- assertNotVisible: ${output.editedTag}
