appId: com.project200.undabang
name: 선호 운동 설정 - 추가·변경·검증과 복구
tags:
  - regression
  - requires-login
---
# 전용 계정은 선호 운동이 최소 1개 이상 저장돼 있다고 가정합니다(README에 명시). 완전 해제 상태는
# PreferredExerciseViewModel.validateComplete가 저장을 막아서(NoneSelected) 복구할 수 있는 빈 상태가
# 아니기 때문입니다. 이 플로우는 기존 선택을 건드리지 않고, 화면에 남은 미선택 종목 중 하나만 추가했다가
# 끝에서 그 종목만 다시 지워 원래 목록으로 되돌립니다.
#
# 종목 이름은 서버 카탈로그 순서로 나와 계정마다 다르고 추가한 종목이 선택 목록의 몇 번째에 놓일지도
# 알 수 없습니다. 그래서 testTag + selected로 종목을 고르고, 상세 단계의 요일/숙련도 버튼은 방금 읽어 둔
# 종목 이름 텍스트 바로 아래(below)에 있는 버튼만 index로 골라 다른 카드와 섞이지 않게 합니다
- runFlow: ../subflows/launch-logged-in.yaml

- tapOn:
    id: profile_nav_graph
- extendedWaitUntil:
    visible: "최근 30일 운동 횟수"
    timeout: 30000

- tapOn:
    id: preferred_exercise_edit_btn
- extendedWaitUntil:
    visible:
      id: preferred_exercise_type_chip
    timeout: 30000

- copyTextFrom:
    id: preferred_exercise_type_chip
    selected: false
- evalScript: ${output.exName = maestro.copiedText}

- tapOn:
    id: preferred_exercise_type_chip
    selected: false
- assertVisible:
    text: ${output.exName}
    selected: true

- tapOn: "다음"

# 요일·숙련도가 비어 있는 채로 저장 시도 -> 최소 요일 조건에 막힙니다
- tapOn: "완료"
- extendedWaitUntil:
    visible: "요일과 숙련도를 모두 선택해주세요"
    timeout: 10000

# 요일만 하나(월) 채우고 숙련도 없이 저장 시도 -> 여전히 막힙니다
- tapOn:
    id: preferred_exercise_day_btn
    below:
      text: ${output.exName}
    index: 0
- tapOn: "완료"
- extendedWaitUntil:
    visible: "요일과 숙련도를 모두 선택해주세요"
    timeout: 10000

# 숙련도까지 채우면 저장이 통과합니다
- tapOn:
    id: preferred_exercise_skill_btn
    below:
      text: ${output.exName}
    index: 0
- tapOn: "완료"
- extendedWaitUntil:
    visible: "선호 운동이 저장되었습니다"
    timeout: 15000

# 마이페이지 목록에 새 종목 이름이 보입니다
- extendedWaitUntil:
    visible: ${output.exName}
    timeout: 15000

# 재진입해서 저장된 요일·숙련도가 유지되는지 확인합니다(저장 버튼 클릭만으로 통과시키지 않습니다)
- tapOn:
    id: preferred_exercise_edit_btn
- extendedWaitUntil:
    visible:
      id: preferred_exercise_type_chip
    timeout: 30000
- assertVisible:
    text: ${output.exName}
    selected: true
- tapOn: "다음"
- assertVisible:
    id: preferred_exercise_day_btn
    below:
      text: ${output.exName}
    index: 0
    selected: true
- assertVisible:
    id: preferred_exercise_skill_btn
    below:
      text: ${output.exName}
    index: 0
    selected: true

# 기존 설정 변경: 요일을 하나(수) 더 추가합니다
- tapOn:
    id: preferred_exercise_day_btn
    below:
      text: ${output.exName}
    index: 2
- tapOn: "완료"
- extendedWaitUntil:
    visible: "선호 운동이 저장되었습니다"
    timeout: 15000

# 일부 해제: 처음 선택했던 월요일만 해제합니다. 수요일이 남아 있어 완전 해제가 아니라 저장됩니다
- tapOn:
    id: preferred_exercise_edit_btn
- extendedWaitUntil:
    visible:
      id: preferred_exercise_type_chip
    timeout: 30000
- tapOn: "다음"
- tapOn:
    id: preferred_exercise_day_btn
    below:
      text: ${output.exName}
    index: 0
- tapOn: "완료"
- extendedWaitUntil:
    visible: "선호 운동이 저장되었습니다"
    timeout: 15000

# 최소 한 종목 검증: 화면에 선택된 모든 종목(기존 것 포함)을 해제하면 저장이 막힙니다.
# 전체 해제 저장은 차단된 동작이라 성공 기준으로 보지 않습니다 — 막히는지만 확인하고 저장하지 않고 빠져나갑니다
- tapOn:
    id: preferred_exercise_edit_btn
- extendedWaitUntil:
    visible:
      id: preferred_exercise_type_chip
    timeout: 30000
- repeat:
    while:
      visible:
        id: preferred_exercise_type_chip
        selected: true
    commands:
      - tapOn:
          id: preferred_exercise_type_chip
          selected: true
- tapOn: "다음"
- tapOn: "완료"
- extendedWaitUntil:
    visible: "최소 하나의 운동을 선택해주세요"
    timeout: 10000
# 저장하지 않고 두 번 뒤로 가 로컬 변경(전체 해제 포함)을 버립니다. 서버 값은 그대로입니다
- back
- back

# 정리: 우리가 추가한 종목만 다시 해제해 저장합니다. 기존 베이스라인 종목은 건드리지 않습니다
- tapOn:
    id: preferred_exercise_edit_btn
- extendedWaitUntil:
    visible:
      id: preferred_exercise_type_chip
    timeout: 30000
- tapOn:
    text: ${output.exName}
    selected: true
- tapOn: "다음"
- tapOn: "완료"
- extendedWaitUntil:
    visible: "선호 운동이 저장되었습니다"
    timeout: 15000
- extendedWaitUntil:
    notVisible: ${output.exName}
    timeout: 15000
