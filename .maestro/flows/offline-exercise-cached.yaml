appId: com.project200.undabang
name: 오프라인 생성 후 재실행한 목록 상세 영속성
---
# 호스트가 두 라디오와 현재 기본망의 단절을 확인한 뒤 실행합니다.
- stopApp
- runFlow: ../subflows/launch-logged-in.yaml
- tapOn:
    id: exercise_nav_graph
- runFlow:
    file: ../offline/assert-exercise-record.yaml
    env:
      RECORD_TITLE: "${EXERCISE_TITLE}"
      START_MINUTE: "00"
