appId: com.project200.undabang
name: 서버 연결 기록의 오프라인 삭제와 전체 목록 부재
---
- runFlow:
    file: ../subflows/assert-exercise-detail.yaml
    env:
      RECORD_TITLE: "${EDITED_EXERCISE_TITLE}"
      START_MINUTE: "05"
- tapOn:
    id: exercise_detail_menu
- tapOn: "삭제하기"
- assertVisible: "운동 기록을 삭제하시겠습니까[?]"
- tapOn: "확인"
- extendedWaitUntil:
    visible:
      id: exercise_create_btn
    timeout: 30000
- assertNotVisible:
    id: exercise_detail_menu
- runFlow:
    file: ../subflows/assert-exercise-records-absent.yaml
    env:
      ABSENT_RECORD_PATTERN: "${EXERCISE_TITLE + '|' + EDITED_EXERCISE_TITLE}"
