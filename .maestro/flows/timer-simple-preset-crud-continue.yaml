appId: com.project200.undabang
name: 심플 타이머 프리셋 수정 단계
---
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/timer-open-list.yaml
- tapOn: "심플 타이머"
- scrollUntilVisible:
    element:
      id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    text: "00:41"
- tapOn:
    id: "simple_timer_menu_${TIMER_LOCAL_ID}"
- tapOn: "수정"
- runFlow:
    file: ../subflows/timer-set-time.yaml
    env:
      TIMER_MINUTES: "0"
      TIMER_SECONDS: "42"
- scrollUntilVisible:
    element:
      id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    text: "00:42"
- back
- extendedWaitUntil:
    visible: "심플 타이머"
    timeout: 30000
- tapOn: "심플 타이머"
- scrollUntilVisible:
    element:
      id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "simple_timer_preset_${TIMER_LOCAL_ID}"
    text: "00:42"
