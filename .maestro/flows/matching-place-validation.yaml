appId: com.project200.undabang
name: 운동 장소 등록 유효성과 위치 권한 거부
tags:
  - regression
  - requires-login
---
# 두 가지를 봅니다
# 1) 장소명을 비운 채 등록을 누르면 저장되지 않고 등록 화면에 머무르는지 (ExercisePlaceRegisterViewModel.confirmExercisePlace, isBlank면 return)
# 2) 위치 권한을 거부해도 장소 검색·등록 화면 자체는 들어갈 수 있고 기본 위치(서울시청)로 동작하는지
#    (ExercisePlaceSearchFragment.setupInitialMapPosition의 else 분기)
# 권한 거부는 모든 장소 기능을 막지 않는다는 완료 기준을 확인하는 것이 목적이라, "막힌다"가 아니라 "그래도 된다"를 검증합니다

# --- 1) 빈 이름 저장 방지 (위치 권한은 평소대로 허용된 상태) ---
- runFlow: ../subflows/launch-logged-in.yaml

- tapOn:
    id: matching_nav_graph
- runFlow: ../subflows/matching-dismiss-guides.yaml
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 30000
- tapOn: "운동 장소 목록"
- extendedWaitUntil:
    visible: "운동 장소"
    timeout: 20000
- tapOn: "추가"
- extendedWaitUntil:
    visible:
      id: "place_name_tv"
      text: ".+"
    timeout: 30000
- tapOn:
    id: "register_exercise_place_btn"
- extendedWaitUntil:
    visible: "장소명 (필수)"
    timeout: 20000

# 입력값을 모두 지운 채 등록을 시도합니다. confirmExercisePlace()는 isBlank면 아무 결과도 emit하지 않아
# 토스트 문구("운동 장소를 입력해주세요.")는 뜨지만 화면 전환은 일어나지 않습니다
- tapOn:
    id: "place_name_input"
- eraseText: 80
- tapOn: "주소 등록"
- assertVisible: "장소명 (필수)"
- assertVisible:
    id: "place_name_input"

# 아무 것도 등록하지 않았으므로 정리할 데이터가 없습니다. 지도로 돌아갑니다
# 검색 화면의 뒤로가기 아이콘(back_btn)에는 contentDescription이 없어 텍스트로 잡을 수 없습니다. 시스템 back을 씁니다
- back
- back
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000

# --- 2) 위치 권한 거부의 대표 동작 ---
# clearState 없이 위치 권한만 되돌려 revoke합니다. 세션은 유지되고 location 권한만 거부 상태가 됩니다
# 권한 상태: 이 블록 동안 ACCESS_FINE_LOCATION / ACCESS_COARSE_LOCATION 모두 거부
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: deny
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
- tapOn:
    id: matching_nav_graph
# MatchingMapFragment.restoreInitialCamera()도 권한이 없으면 지도가 뜨자마자 자체적으로 위치 권한을 요청합니다
# 검색 화면과 별개로 매칭 탭 진입 시 한 번 더 뜨는 다이얼로그라 먼저 닫아야 "운동 장소 목록"이 보입니다
- waitForAnimationToEnd:
    timeout: 2000
- back
- runFlow: ../subflows/matching-dismiss-guides.yaml
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 30000
- tapOn: "운동 장소 목록"
- extendedWaitUntil:
    visible: "운동 장소"
    timeout: 20000
- tapOn: "추가"

# 권한이 없으면 setupInitialMapPosition()이 서울시청 기본 위치로 이동하면서 동시에 위치 권한을 요청합니다
# 지도 로드와 권한 다이얼로그가 뜨는 데 시간이 걸려, 너무 일찍 back을 누르면 다이얼로그 대신 화면 자체가 닫힙니다
- waitForAnimationToEnd:
    timeout: 3000
# 요청 다이얼로그가 뜨면 back으로 닫습니다. API 29+에서 뒤로가기로 닫으면 거부로 처리됩니다(기기/버전에 따라 다를 수 있어 실행 검증 필요)
- back

# 권한이 없어도 화면 자체는 기본 위치 기준 주소를 보여주고 등록 버튼도 그대로 활성화돼 있습니다
# 즉 위치 권한 거부가 장소 검색·등록 화면 진입 자체를 막지 않는다는 것을 확인합니다
- extendedWaitUntil:
    visible:
      id: "place_name_tv"
      text: ".+"
    timeout: 30000
- assertVisible:
    id: "register_exercise_place_btn"

# 아무 것도 등록하지 않고 지도로 돌아갑니다
- tapOn:
    id: "back_btn"
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000

# 위치 권한을 원상 복구합니다. 그대로 두면 이 뒤에 도는 다른 플로우(장소 등록, 채팅 요청)가 깨집니다
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: allow
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
