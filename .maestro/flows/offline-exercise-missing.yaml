appId: com.project200.undabang
name: 운동 캐시 없는 첫 조회는 네트워크 오류
---
# 별도 pm clear와 인증 뒤 운동 화면을 한 번도 열지 않고 실제 망을 끊습니다.
- runFlow: ../subflows/launch-logged-in.yaml
- tapOn:
    id: exercise_nav_graph
- extendedWaitUntil:
    visible: "네트워크 연결 오류가 발생했습니다."
    timeout: 30000
- assertVisible: "네트워크 연결 오류가 발생했습니다."
- assertVisible:
    id: exercise_create_btn
# 초기 빈 목록을 성공한 빈 캐시로 오인하지 않습니다.
- assertNotVisible: "운동 기록 목록이 없습니다"
