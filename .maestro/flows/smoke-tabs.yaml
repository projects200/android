appId: com.project200.undabang
name: 하단 탭 순회
tags:
  - smoke
  - requires-login
---
# 탭을 눌렀을 때 그 탭이 선택되고 해당 화면이 떴는지 봅니다.
# 탭 라벨과 화면 제목이 같은 탭이 있어(피드) 텍스트 단언만으로는 눌리지 않아도 통과합니다.
# 그래서 내비 항목의 selected 상태를 함께 겁니다
- runFlow: ../subflows/launch-logged-in.yaml

# 기록 - XML 화면
- tapOn:
    id: exercise_nav_graph
- assertVisible:
    id: exercise_nav_graph
    selected: true
- assertVisible:
    id: exercise_create_btn
- assertVisible: "이번 달 운동 횟수"

# 매칭 - 카카오맵 위에 올린 Compose 툴바
- tapOn:
    id: matching_nav_graph
- assertVisible:
    id: matching_nav_graph
    selected: true
- assertVisible: "운동 장소 목록"

# 피드 - Compose
- tapOn:
    id: feed_nav_graph
- assertVisible:
    id: feed_nav_graph
    selected: true
# DEV 피드는 공용 데이터라 목록 유무를 고정하지 않습니다. 실제 행 또는 성공한 빈 응답을 기다립니다.
- extendedWaitUntil:
    visible:
      id: "feed_content|feed_empty"
    timeout: 30000
- assertVisible:
    id: "feed_content|feed_empty"

# 채팅
- tapOn:
    id: chatting_nav_graph
- assertVisible:
    id: chatting_nav_graph
    selected: true
# 계정에 채팅방이 있으면 실제 닉네임 행, 없으면 최초 조회가 끝난 빈 상태를 확인합니다.
- extendedWaitUntil:
    visible:
      text: "(?s).*님과의 채팅|채팅 목록에 채팅방이 없습니다"
    timeout: 30000
- assertVisible:
    text: "(?s).*님과의 채팅|채팅 목록에 채팅방이 없습니다"

# MY - XML 화면
- tapOn:
    id: profile_nav_graph
- assertVisible:
    id: profile_nav_graph
    selected: true
- assertVisible: "최근 30일 운동 횟수"
- assertVisible: "선호 운동"
