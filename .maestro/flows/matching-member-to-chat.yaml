appId: com.project200.undabang
name: 지정 회원의 지도 마커부터 실제 채팅방·권한 거부까지
tags:
  - regression
  - requires-login
---
# 준비 단계가 지정 peer의 프로필·실제 장소·기존 전용 방을 API로 검증했습니다.
# 이 플로우는 임의 공개 회원이나 프로필 딥링크를 선택하지 않습니다.
- runFlow: ../subflows/launch-logged-in.yaml
- setLocation:
    latitude: ${MATCHING_LATITUDE}
    longitude: ${MATCHING_LONGITUDE}
- tapOn:
    id: matching_nav_graph
- runFlow: ../subflows/matching-dismiss-guides.yaml
- extendedWaitUntil:
    visible:
      id: matching_map_ready
    timeout: 30000
- tapOn: "현재 위치"
- extendedWaitUntil:
    visible: ${MATCHING_PEER_MARKER_PATTERN}
    timeout: 30000
# 이 비상호작용 노드의 중심은 실제 SDK 클러스터 투영입니다. 터치는 네이티브 지도로 전달됩니다.
- tapOn: ${MATCHING_PEER_MARKER_PATTERN}
- extendedWaitUntil:
    visible:
      id: rv_members
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${MATCHING_PEER_ROW_PATTERN}
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ${MATCHING_PEER_ROW_PATTERN}
- extendedWaitUntil:
    visible: "1:1 채팅하기"
    timeout: 30000
- assertVisible: ${MATCHING_PEER_NICKNAME_PATTERN}
- tapOn: "1:1 채팅하기"
- extendedWaitUntil:
    visible:
      id: chatting_message_et
    timeout: 30000
- assertVisible: ${MATCHING_PEER_NICKNAME_PATTERN}
# after_flow는 실제 생성/조회 응답 roomId와 GET rooms.otherMemberId를 모두 검증합니다.
# 기존 방을 나가거나 메시지를 보내지 않습니다.

# 채팅방·프로필에서는 하단 탭이 숨겨집니다. 각 목적지를 확인하며 실제 Back 경로로 지도까지 돌아갑니다.
- back
- extendedWaitUntil:
    visible: "1:1 채팅하기"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000
- assertVisible:
    id: matching_nav_graph

# 권한 거부 분기만 검증합니다. 위치 허용+null lastLocation 분기라고 주장하지 않습니다.
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: deny
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
- tapOn:
    id: matching_nav_graph
- runFlow: ../subflows/matching-deny-location-prompt.yaml
- runFlow: ../subflows/matching-dismiss-guides.yaml
- extendedWaitUntil:
    visible:
      id: matching_map_ready
    timeout: 30000
- runFlow: ../subflows/matching-deny-location-prompt.yaml
# 위치 권한을 거부해도 저장한 지도 카메라는 보존됩니다. 같은 peer·장소 마커를 다시 검증합니다.
- extendedWaitUntil:
    visible: ${MATCHING_PEER_MARKER_PATTERN}
    timeout: 30000
- tapOn: ${MATCHING_PEER_MARKER_PATTERN}
- extendedWaitUntil:
    visible:
      id: rv_members
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${MATCHING_PEER_ROW_PATTERN}
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ${MATCHING_PEER_ROW_PATTERN}
- extendedWaitUntil:
    visible: "1:1 채팅하기"
    timeout: 30000
- assertVisible: ${MATCHING_PEER_NICKNAME_PATTERN}
- tapOn: "1:1 채팅하기"
- runFlow: ../subflows/matching-deny-location-prompt.yaml
- extendedWaitUntil:
    visible: "채팅 요청을 위해 위치 권한을 허용해주세요."
    timeout: 10000
- assertVisible: "1:1 채팅하기"
- assertNotVisible:
    id: chatting_message_et
- back
- extendedWaitUntil:
    visible: "운동 장소 목록"
    timeout: 20000
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: allow
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
