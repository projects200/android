appId: com.project200.undabang
name: 오프라인 재실행 후 생성 수정 삭제 영속성과 작성 중 폼
---
- stopApp
- runFlow: ../offline/open-timer-list.yaml
- runFlow: ../offline/assert-timer-list.yaml
- runFlow:
    file: ../offline/edit-timer.yaml
    env:
      EDIT_TIMER_LOCAL_ID: ${TIMER_CREATE_LOCAL_ID}
      EDIT_TIMER_TITLE: "${TIMER_CREATE_TITLE}"
      EXPECTED_TIMER_TIME: ${TIMER_INITIAL_TIME}
- back
- back
- scrollUntilVisible:
    element:
      id: custom_timer_add_card
    direction: DOWN
    timeout: 30000
- runFlow: ../offline/prepare-timer-draft.yaml
