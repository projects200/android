appId: com.project200.undabang
---
# 시스템 Photo Picker는 앱 밖 화면이라 testTagsAsResourceId가 닿지 않고, 우리 쪽에서 접근성 트리를 확인할 수 없습니다
# Maestro 공식 레시피(docs.maestro.dev: choose-images-from-the-gallery)가 제시하는 SDK별 폴백 선택자를 그대로 가져다 씁니다
# iOS 폴백은 제외합니다. 이 프로젝트는 안드로이드 전용입니다
# 전제: 기기 갤러리에 이미지가 최소 1장 있어야 합니다. 비어 있으면 썸네일이 없어 아래 탭이 전부 실패합니다
# 두 선택자 모두 optional이라, 매칭되지 않는 쪽은 조용히 건너뜁니다. 실제 기기에서 확인하지 못했습니다
- tapOn:
    id: "com.google.android.providers.media.module:id/icon_thumbnail"
    optional: true
- tapOn:
    id: "com.google.android.documentsui:id/thumbnail"
    optional: true

# 폼이 PickMultipleVisualMedia라서 썸네일 탭만으로는 선택이 끝나지 않고 확인(추가) 버튼이 더 필요할 수 있습니다
# 정확한 리소스 id나 버튼 문구를 기기에서 확인하지 못해 자리수가 다른 두 표기만 느슨한 정규식으로 시도합니다
# 둘 다 맞지 않으면 이 단계는 조용히 넘어가고, 뒤따르는 폼 화면 대기가 그대로 실패로 드러냅니다
- tapOn:
    text: "(?i)add.*|추가.*"
    optional: true
