appId: com.project200.undabang
---
# 세션을 유지한 채 실행합니다. clearState를 켜면 토큰이 날아가 로그인 화면으로 떨어집니다.
# 직접 CLI 실행은 수동 로그인 후 사용하고, 호스트 러너는 보호된 플로우마다 실제 세션을 준비합니다.
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: allow

# 스플래시 동안 접근성 트리가 비어 있어 기본 7초로는 모자랍니다
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
