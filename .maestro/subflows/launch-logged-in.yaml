appId: com.project200.undabang
---
# 세션을 유지한 채 실행합니다. clearState를 켜면 토큰이 날아가 로그인 화면으로 떨어집니다.
# 먼저 기기에서 수동 로그인해야 합니다. 이 서브플로우는 로그인하지 않습니다.
- launchApp:
    clearState: false
    permissions:
      all: allow
      notifications: allow
      location: allow

# 스플래시 동안 접근성 트리가 비어 있어 기본 7초로는 모자랍니다
- extendedWaitUntil:
    visible:
      id: matching_nav_graph
    timeout: 60000
