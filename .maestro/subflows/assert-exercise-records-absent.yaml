appId: com.project200.undabang
---
# 성공 응답이 실제 행 배치까지 끝난 정확한 날짜에서만 부재를 검사합니다.
- runFlow: select-exercise-date.yaml
- runFlow:
    when:
      notVisible:
        id: exercise_list_empty_tv
        text: "${EXERCISE_START_DATE.split('.').join('-') + '에 운동 기록이 없습니다'}"
    commands:
      # RecyclerView는 NestedScrollView 안에 있으므로 캘린더부터 부모 스크롤을 훑습니다.
      - assertVisible:
          id: exercise_list_rv
          text: "${EXERCISE_START_DATE.split('.').join('-') + ' 운동 기록 목록'}"
      - scrollUntilVisible:
          element:
            id: date_tv
          direction: UP
          timeout: 30000
      # 느린 20% 이동으로 관찰 영역을 겹칩니다. 끝에 못 도달하면 아래 필수 단언이 실패합니다.
      - repeat:
          times: 200
          while:
            notVisible:
              id: exercise_time_tv
              text: "운동 기록 목록 마지막 항목: .*"
          commands:
            - assertNotVisible:
                id: exercise_title_tv
                text: "${ABSENT_RECORD_PATTERN}"
            - swipe:
                start: "50%, 60%"
                end: "50%, 40%"
                duration: 2000
      # 컨테이너 일부가 아니라 마지막 행의 아래쪽 시간 텍스트까지 관찰해야 종료합니다.
      - assertVisible:
          id: exercise_time_tv
          text: "운동 기록 목록 마지막 항목: .*"
      - assertVisible:
          id: exercise_list_rv
          text: "${EXERCISE_START_DATE.split('.').join('-') + ' 운동 기록 목록'}"
- assertVisible:
    text: "${EXERCISE_START_DATE.split('.').join('-') + '( 운동 기록 목록|에 운동 기록이 없습니다)'}"
- assertNotVisible:
    id: exercise_title_tv
    text: "${ABSENT_RECORD_PATTERN}"
# 재사용 호출부도 첫 행부터 아래로 검색할 수 있도록 캘린더 위치로 돌려놓습니다.
- scrollUntilVisible:
    element:
      id: date_tv
    direction: UP
    timeout: 30000
