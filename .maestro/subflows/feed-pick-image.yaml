appId: com.project200.undabang
---
# Android가 촬영 시각을 기기 locale/timezone으로 포맷한 row와 실제 썸네일을 함께 선택합니다
- scrollUntilVisible:
    element:
      text: ${IMAGE_SELECTOR}
      containsDescendants:
        - id: ".*:id/icon_thumbnail"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ${IMAGE_SELECTOR}
    containsDescendants:
      - id: ".*:id/icon_thumbnail"
- tapOn:
    id: ".*:id/button_add"
    enabled: true
- extendedWaitUntil:
    visible:
      id: feed_form_remove_image_button
    timeout: 20000
