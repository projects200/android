appId: com.project200.undabang
---
# 호출자가 분과 초를 모두 지정하며 커서 위치와 무관하게 전체 값을 교체합니다
- extendedWaitUntil:
    visible:
      id: minute_et
    timeout: 10000
- runFlow:
    file: timer-clear-text.yaml
    env:
      FIELD_ID: minute_et
- inputText: "${('0' + TIMER_MINUTES).slice(-2)}"
- runFlow:
    file: timer-clear-text.yaml
    env:
      FIELD_ID: second_et
- inputText: "${('0' + TIMER_SECONDS).slice(-2)}"
# 기본값의 뒷자리가 남거나 입력이 범위 제한에 걸렸으면 확인 버튼을 누르기 전에 실패합니다.
- runFlow: timer-hide-keyboard.yaml
- assertVisible:
    id: minute_et
    text: "${('0' + TIMER_MINUTES).slice(-2)}"
- assertVisible:
    id: second_et
    text: "${('0' + TIMER_SECONDS).slice(-2)}"
- tapOn:
    id: confirm_btn
