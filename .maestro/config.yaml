flows:
  - "flows/**"

# 로그인 세션을 지우는 플로우를 먼저 돌리면 뒤 플로우가 전부 로그인 화면에서 멈춥니다.
# 세션을 쓰는 플로우를 앞에 두고 login-screen을 마지막에 둡니다
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - smoke-tabs
    - exercise-form-entry
    - exercise-crud
    - login-screen

# chatting-send/receive/history/list-refresh.yaml(태그 requires-two-devices)는 계정 2개와
# 기기 2대가 동시에 필요해 여기 순서에 넣지 않습니다. maestro test .maestro/ 같은 단일 기기
# 전체 실행에서는 --exclude-tags=requires-two-devices로 빼고, 실행 방법은
# .maestro/README-chatting.md를 따로 둡니다

testOutputDir: build/maestro
