appId: com.project200.undabang
---
- scrollUntilVisible:
    element:
      id: "custom_timer_${EDIT_TIMER_LOCAL_ID}"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "custom_timer_${EDIT_TIMER_LOCAL_ID}"
    containsDescendants:
      - text: ${EDIT_TIMER_TITLE}
- tapOn:
    id: "custom_timer_${EDIT_TIMER_LOCAL_ID}"
- extendedWaitUntil:
    visible:
      id: custom_timer_menu_btn
    timeout: 30000
- tapOn:
    id: custom_timer_menu_btn
- tapOn: 수정하기
- extendedWaitUntil:
    visible:
      id: custom_timer_form_title_field
      text: "${EDIT_TIMER_TITLE}"
    timeout: 30000
- assertVisible:
    id: custom_timer_form_step_name_0
    text: ${TIMER_STEP_NAME}
- assertVisible:
    id: custom_timer_form_step_time_0
    text: "${EXPECTED_TIMER_TIME}"
