appId: com.project200.undabang
---
- runFlow: ../subflows/select-exercise-date.yaml
- scrollUntilVisible:
    element:
      id: exercise_complete_iv
      text: "${'운동 기록이 있는 날짜: ' + EXERCISE_START_DATE.split('.').join('-')}"
    direction: UP
    timeout: 30000
- assertVisible:
    id: exercise_complete_iv
    text: "${'운동 기록이 있는 날짜: ' + EXERCISE_START_DATE.split('.').join('-')}"
- scrollUntilVisible:
    element:
      id: exercise_title_tv
      text: "${EXERCISE_TITLE}"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: exercise_list_cl
    containsDescendants:
      - id: exercise_title_tv
        text: "${EXERCISE_TITLE}"
      - id: exercise_time_tv
        text: "${EXERCISE_START_HOUR + ':00 ~ ' + EXERCISE_END_HOUR + ':00'}"
- tapOn:
    id: exercise_title_tv
    text: "${EXERCISE_TITLE}"
- runFlow:
    file: ../subflows/assert-exercise-detail.yaml
    env:
      RECORD_TITLE: "${EXERCISE_TITLE}"
      START_MINUTE: "00"
