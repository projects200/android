appId: com.project200.undabang
---
# 날짜 선택 후 최신 성공 목록이 실제 행 배치까지 끝났는지 확인합니다.
- runFlow: ../subflows/select-exercise-date.yaml
- assertVisible:
    id: exercise_list_rv
    text: "${EXERCISE_START_DATE.split('.').join('-') + ' 운동 기록 목록'}"
# 하단 고정 작성 버튼에 행의 탭 지점이 가리지 않도록 목록 안쪽으로 이동합니다.
- scrollUntilVisible:
    element:
      id: exercise_title_tv
      text: "${RECORD_TITLE}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: exercise_title_tv
    text: "${RECORD_TITLE}"
- assertVisible:
    id: exercise_list_cl
    containsDescendants:
      - id: exercise_title_tv
        text: "${RECORD_TITLE}"
      - id: exercise_time_tv
        text: "${EXERCISE_START_HOUR + ':' + START_MINUTE + ' ~ ' + EXERCISE_END_HOUR + ':00'}"
# 상세 이동 리스너는 행 컨테이너에 있으므로 자식 제목 대신 제목·시각이 일치하는 소유 기록 행을 탭합니다.
- tapOn:
    id: exercise_list_cl
    containsDescendants:
      - id: exercise_title_tv
        text: "${RECORD_TITLE}"
      - id: exercise_time_tv
        text: "${EXERCISE_START_HOUR + ':' + START_MINUTE + ' ~ ' + EXERCISE_END_HOUR + ':00'}"
- runFlow:
    file: ../subflows/assert-exercise-detail.yaml
    env:
      RECORD_TITLE: "${RECORD_TITLE}"
      START_MINUTE: "${START_MINUTE}"
