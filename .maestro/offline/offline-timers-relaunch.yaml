appId: com.project200.undabang
name: 오프라인 재실행 후 생성 수정 삭제 영속성과 작성 중 폼
---
- stopApp
- runFlow: open-timer-list.yaml
- runFlow: assert-timer-list.yaml
- runFlow:
    file: edit-timer.yaml
    env:
      EDIT_TIMER_TITLE: "${TIMER_CREATE_TITLE}"
      EXPECTED_TIMER_TIME: "00:45"
- back
- back
- scrollUntilVisible:
    element:
      id: custom_timer_add
    direction: DOWN
    timeout: 30000
- runFlow: prepare-timer-draft.yaml
