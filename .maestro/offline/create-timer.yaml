appId: com.project200.undabang
---
- scrollUntilVisible:
    element:
      id: custom_timer_add
    direction: DOWN
    timeout: 30000
- tapOn:
    id: custom_timer_add
- extendedWaitUntil:
    visible:
      id: custom_timer_title
    timeout: 30000
- tapOn:
    id: custom_timer_title
- inputText: "${NEW_TIMER_TITLE}"
- hideKeyboard
- tapOn:
    id: custom_timer_new_step_name
- inputText: offline-step
- hideKeyboard
- runFlow:
    file: set-timer-time.yaml
    env:
      TIMER_TIME_FIELD: custom_timer_new_step_time
      TIMER_MINUTES: "00"
      TIMER_SECONDS: "45"
- tapOn:
    id: custom_timer_add_step
- assertVisible:
    id: custom_timer_step_name_0
    text: offline-step
- assertVisible:
    id: custom_timer_step_time_0
    text: "00:45"
- tapOn:
    id: custom_timer_complete
- extendedWaitUntil:
    visible:
      id: custom_timer_detail
    timeout: 30000
- assertVisible: "${NEW_TIMER_TITLE}"
- assertVisible: offline-step
- back
- extendedWaitUntil:
    visible:
      id: custom_timer_list
    timeout: 30000
