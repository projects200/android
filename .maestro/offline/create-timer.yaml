appId: com.project200.undabang
---
- scrollUntilVisible:
    element:
      id: custom_timer_add_card
    direction: DOWN
    timeout: 30000
- tapOn:
    id: custom_timer_add_card
- extendedWaitUntil:
    visible:
      id: custom_timer_form_title_field
    timeout: 30000
- tapOn:
    id: custom_timer_form_title_field
- inputText: "${NEW_TIMER_TITLE}"
- hideKeyboard
- tapOn:
    id: custom_timer_form_new_step_name_field
- inputText: ${TIMER_STEP_NAME}
- hideKeyboard
- runFlow:
    file: set-timer-time.yaml
    env:
      TIMER_TIME_FIELD: custom_timer_form_new_step_time
      TIMER_MINUTES: ${TIMER_INITIAL_MINUTES_PART}
      TIMER_SECONDS: ${TIMER_INITIAL_SECONDS_PART}
- tapOn:
    id: custom_timer_form_add_step_btn
- assertVisible:
    id: custom_timer_form_step_name_0
    text: ${TIMER_STEP_NAME}
- assertVisible:
    id: custom_timer_form_step_time_0
    text: ${TIMER_INITIAL_TIME}
- tapOn:
    id: custom_timer_form_submit_btn
- extendedWaitUntil:
    visible:
      text: "${NEW_TIMER_TITLE}"
    timeout: 30000
- assertVisible:
    id: custom_timer_step_name_0
    text: ${TIMER_STEP_NAME}
- assertVisible:
    id: custom_timer_step_time_0
    text: ${TIMER_INITIAL_TIME}
- back
- scrollUntilVisible:
    element:
      id: custom_timer_add_card
    direction: DOWN
    timeout: 30000
