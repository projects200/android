name: Android CI (dev)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  dev-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
        run: |
          echo "Decoding google-services.json..."
          mkdir -p app/src/debug
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > app/src/debug/google-services.json
          echo "google-services.json created successfully."

      - name: Prepare E2E google-services.json for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p app/src/e2e
          cp app/src/debug/google-services.json app/src/e2e/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "COGNITO_USER_POOL_ID_DEV=${{ secrets.COGNITO_USER_POOL_ID_DEV }}" >> local.properties
          echo "COGNITO_APP_CLIENT_ID_DEV=${{ secrets.COGNITO_APP_CLIENT_ID_DEV }}" >> local.properties
          echo "COGNITO_REGION_DEV=${{ secrets.COGNITO_REGION_DEV }}" >> local.properties
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY_DEV }}" >> local.properties
          echo "KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}" >> local.properties
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run manual validation without devices or deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            lintDebug ktlintCheck testDebugUnitTest :domain:test \
            jacocoLogicReport jacocoLogicCoverageVerification assembleDebug \
            :app:lintE2e :app:testE2eUnitTest :app:assembleE2e

      - name: Run Android Lint (Debug)
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew lintDebug

      - name: Run Ktlint Check
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew ktlintCheck

      - name: Run Unit Tests
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew testDebugUnitTest
      - name: Verify JaCoCo line coverage
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew jacocoLogicReport jacocoLogicCoverageVerification

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleDebug

      - name: Upload schema and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-local-first-evidence
          path: |
            data/schemas/**/*.json
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/lint-results*
            **/build/reports/ktlint/**
          if-no-files-found: warn

      - name: Check for APK
        run: |
          echo "Checking the contents of the build output directory..."
          ls -R app/build/outputs/apk

      - name: Install Firebase CLI
        if: github.event_name != 'workflow_dispatch'
        run: npm install -g firebase-tools

      - name: Upload Debug APK to Firebase App Distribution
        if: github.event_name != 'workflow_dispatch'
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_DEV_ID }} \
            --release-notes "CI build from dev branch (via CLI)" \
            --groups "testers" \
            --token ${{ secrets.FIREBASE_TOKEN }}
