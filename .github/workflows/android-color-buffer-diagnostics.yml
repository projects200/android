name: Android ColorBuffer diagnostics (public source)

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/android-color-buffer-diagnostics.yml'
      - '.maestro/emulator/**'
      - '.maestro/scripts/*color*buffer*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-untrusted:
    name: Diagnostics unavailable (untrusted ref)
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association))) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse native execution and authenticated account access
        run: |
          echo 'ColorBuffer diagnostics did not run: require a trusted same-repository dev PR or manual dev run.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  native-build:
    name: Build complete public emulator pair (no secrets)
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    # This job has no environment, no account secrets, and no persisted checkout credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe hosted resources and free fixed unused toolchains
        run: |
          mkdir -p build/color-buffer-native
          printf '%s\n' 'Before fixed-path cleanup' > build/color-buffer-native/resource-observations.log
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a build/color-buffer-native/resource-observations.log
          if [ -d /mnt ]; then df -h /mnt; fi | tee -a build/color-buffer-native/resource-observations.log
          free -h | tee -a build/color-buffer-native/resource-observations.log
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /usr/local/lib/android
          printf '%s\n' 'After fixed-path cleanup' >> build/color-buffer-native/resource-observations.log
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a build/color-buffer-native/resource-observations.log
          if [ -d /mnt ]; then df -h /mnt; fi | tee -a build/color-buffer-native/resource-observations.log
          free -h | tee -a build/color-buffer-native/resource-observations.log
      - name: Upload pre-build native resource observations
        uses: actions/upload-artifact@v4
        with:
          name: color-buffer-native-resources-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/color-buffer-native/resource-observations.log
      - name: Run metadata, archive and sequential-run behavioral tests
        run: |
          python3 -m unittest discover -s .maestro/scripts -p 'test_color_buffer*.py'
          python3 -m unittest discover -s .maestro/emulator -p 'test_*.py'
      - name: Build baseline and instrumented complete emulator distributions
        run: bash .maestro/emulator/build-public-emulator.sh "$RUNNER_TEMP/color-buffer-source" "$RUNNER_TEMP/color-buffer-packages"
      - name: Publish package pair and exact public source provenance
        uses: actions/upload-artifact@v4
        with:
          name: color-buffer-packages-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/color-buffer-packages/baseline.tar.gz
            ${{ runner.temp }}/color-buffer-packages/instrumented.tar.gz
            ${{ runner.temp }}/color-buffer-packages/resolved-manifest.xml
            ${{ runner.temp }}/color-buffer-packages/provenance.json
      - name: Record native build outcome separately
        if: always()
        env:
          NATIVE_BUILD_STATUS: ${{ job.status }}
        run: |
          mkdir -p build/color-buffer-native
          printf 'Native build job: %s\nScope: public source, not SDK build 16740729\n' "$NATIVE_BUILD_STATUS" > build/color-buffer-native/build-status.log
          cat build/color-buffer-native/build-status.log >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'At native job completion' >> build/color-buffer-native/resource-observations.log
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >> build/color-buffer-native/resource-observations.log
          free -h >> build/color-buffer-native/resource-observations.log
      - name: Upload native build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-buffer-native-status-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/color-buffer-native/build-status.log
            build/color-buffer-native/resource-observations.log

  reproduce:
    name: Full ci baseline then instrumented (DEV)
    needs: native-build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: maestro-dev
      deployment: false
    concurrency:
      group: maestro-dev-dedicated-account
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize independent diagnostic status
        run: |
          mkdir -p build/color-buffer
          printf '%s\n' 'Reproduction job started. No emulator boot, test pass or trace capture is implied.' > build/color-buffer/workflow-status.log
      - name: Download only this run's complete package pair
        uses: actions/download-artifact@v4
        with:
          name: color-buffer-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/color-buffer-packages
      - name: Free unused hosted runner toolchains
        run: |
          df -h "$GITHUB_WORKSPACE" "$HOME"
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift
          df -h "$GITHUB_WORKSPACE" "$HOME"
      - name: Run existing shared and feature behavior tests without accounts
        run: |
          python3 -m unittest discover -s .maestro/scripts -p 'test_*.py'
          if [ -d .maestro/scripts/features ]; then
            python3 -m unittest discover -s .maestro/scripts/features -p 'test_*.py'
          fi
      - name: Prepare real private DEV build configuration
        env:
          GOOGLE_SERVICES_JSON_DEV_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
          COGNITO_USER_POOL_ID_DEV: ${{ secrets.COGNITO_USER_POOL_ID_DEV }}
          COGNITO_APP_CLIENT_ID_DEV: ${{ secrets.COGNITO_APP_CLIENT_ID_DEV }}
          COGNITO_REGION_DEV: ${{ secrets.COGNITO_REGION_DEV }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEV }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          MAESTRO_AUTH_STATE_JSON: ${{ secrets.MAESTRO_AUTH_STATE_JSON }}
          MAESTRO_MEMBER_ID: ${{ secrets.MAESTRO_MEMBER_ID }}
          MAESTRO_FIXTURE_START_DATE: ${{ secrets.MAESTRO_FIXTURE_START_DATE }}
        run: python3 .maestro/scripts/configure-ci.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK without launching its stock emulator
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 system-images;android-34;google_apis;x86_64'
      - name: Install checksummed Maestro 2.11.0
        env:
          MAESTRO_RELEASE_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl -fLsS https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' "$MAESTRO_RELEASE_SHA256" "$RUNNER_TEMP/maestro.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          chmod +x "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable and check KVM
        run: |
          id
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          stat -c 'KVM node: type=%F mode=%a owner=%U group=%G' /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Restore fixed E2E debug signing
        env:
          MAESTRO_DEBUG_KEYSTORE_BASE64: ${{ secrets.MAESTRO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAESTRO_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/maestro"
          printf '%s' "$MAESTRO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maestro/debug.keystore"
          chmod 600 "$RUNNER_TEMP/maestro/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/maestro/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Lint, test and build one exact DEV E2E APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -Pmaestro.e2e.signing.store.file="$RUNNER_TEMP/maestro/debug.keystore" \
            -Pmaestro.e2e.signing.store.password=android \
            -Pmaestro.e2e.signing.key.alias=androiddebugkey \
            -Pmaestro.e2e.signing.key.password=android \
            :app:lintE2e :app:testE2eUnitTest :app:assembleE2e
          test -f app/build/outputs/apk/e2e/app-e2e.apk
      - name: Validate full ci inputs, packages and sequentially reproduce
        env:
          MAESTRO_AUTH_STATE_JSON: ${{ secrets.MAESTRO_AUTH_STATE_JSON }}
          MAESTRO_MEMBER_ID: ${{ secrets.MAESTRO_MEMBER_ID }}
          MAESTRO_FIXTURE_START_DATE: ${{ secrets.MAESTRO_FIXTURE_START_DATE }}
          MAESTRO_PEER_MEMBER_ID: ${{ secrets.MAESTRO_PEER_MEMBER_ID }}
          MAESTRO_MATCHING_LEFT_TOP_LATITUDE: ${{ secrets.MAESTRO_MATCHING_LEFT_TOP_LATITUDE }}
          MAESTRO_MATCHING_LEFT_TOP_LONGITUDE: ${{ secrets.MAESTRO_MATCHING_LEFT_TOP_LONGITUDE }}
          MAESTRO_MATCHING_RIGHT_BOTTOM_LATITUDE: ${{ secrets.MAESTRO_MATCHING_RIGHT_BOTTOM_LATITUDE }}
          MAESTRO_MATCHING_RIGHT_BOTTOM_LONGITUDE: ${{ secrets.MAESTRO_MATCHING_RIGHT_BOTTOM_LONGITUDE }}
          MAESTRO_MATCHING_SEARCH_QUERY: ${{ secrets.MAESTRO_MATCHING_SEARCH_QUERY }}
          MAESTRO_MATCHING_CATALOG_PLACE_NAME: ${{ secrets.MAESTRO_MATCHING_CATALOG_PLACE_NAME }}
          MAESTRO_MATCHING_ROOM_ID: ${{ secrets.MAESTRO_MATCHING_ROOM_ID }}
        run: >-
          python3 .maestro/scripts/run-color-buffer-diagnostics.py
          --packages "$RUNNER_TEMP/color-buffer-packages"
          --apk app/build/outputs/apk/e2e/app-e2e.apk
      - name: Remove private build files and record workflow outcome
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          rm -f local.properties app/src/e2e/google-services.json "$RUNNER_TEMP/maestro/debug.keystore"
          mkdir -p build/color-buffer
          printf 'Reproduction workflow job: %s\nNative build, test outcome, trace completeness and error reproduction are separate results.\n' "$WORKFLOW_STATUS" > build/color-buffer/workflow-status.log
          cat build/color-buffer/workflow-status.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only rewritten lifecycle metadata and existing safe test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-buffer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/color-buffer/**/*.json
            build/color-buffer/**/*.jsonl
            build/color-buffer/**/*.log
            build/color-buffer/resolved-manifest.xml
            build/maestro/**/*.xml
            build/maestro/**/*.log
            build/maestro/**/*.json
            build/maestro/**/*.png
      - name: Publish E2E unit test outcomes separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-buffer-e2e-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/test-results/testE2eUnitTest/*.xml
            app/build/reports/tests/testE2eUnitTest/**
